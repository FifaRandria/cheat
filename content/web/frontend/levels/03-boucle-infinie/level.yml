id: react-03
title: 4 000 requêtes par seconde vers l'API
order: 3
type: quiz
difficulty: 3
xp: 90
blackout: false
hintCost: 15
bugType: mutation
lessons: [react-03]
brief: |
  L'équipe backend panique : depuis la dernière mise en production du frontend, l'API reçoit
  **4 000 requêtes par seconde** vers `/api/commandes`, alors que le site n'a que quelques
  dizaines de visiteurs. Dans le navigateur, la page « Mes commandes » fige l'ordinateur.

  Pour chaque extrait de composant, diagnostique le comportement.
hints:
  - "Un effet qui modifie une de ses propres dépendances se relance à l'infini."
  - "Un objet créé pendant le rendu est un nouvel objet à chaque rendu."
questions:
  - prompt: |
      ```js
      useEffect(() => {
        fetch("/api/commandes").then((r) => r.json()).then(setCommandes);
      });
      ```

      Que se passe-t-il ?
    choices:
      - Une seule requête au chargement
      - Une requête après chaque rendu ; et comme setCommandes provoque un rendu, une boucle infinie
      - Aucune requête
    answer: 1
  - prompt: Quelle correction appliquer à l'extrait précédent ?
    choices:
      - "Ajouter `[]` comme second argument de useEffect"
      - "Ajouter `[commandes]` comme second argument"
      - Retirer setCommandes
    answer: 0
    hint: "On veut charger une seule fois, au premier affichage."
  - prompt: |
      ```js
      const filtres = { statut: "payee" };
      useEffect(() => { charger(filtres); }, [filtres]);
      ```

      Pourquoi l'effet se relance-t-il à chaque rendu ?
    choices:
      - Parce que filtres est un nouvel objet à chaque rendu
      - Parce que charger est asynchrone
      - Il ne se relance pas
    answer: 0
  - prompt: Quelle correction est la plus simple pour l'extrait précédent ?
    choices:
      - "Dépendre de la valeur simple : `[filtres.statut]`, ou déclarer filtres hors du composant"
      - Supprimer le tableau de dépendances
      - Ajouter un setTimeout
    answer: 0
  - prompt: |
      ```js
      useEffect(() => { setTotal(total + 1); }, [total]);
      ```

      Ce code…
    choices:
      - Incrémente total une seule fois
      - Crée une boucle infinie, car l'effet modifie sa propre dépendance
      - Ne fait rien
    answer: 1
