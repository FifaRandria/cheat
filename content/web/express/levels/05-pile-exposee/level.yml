brief: |
  **Mode Blackout. Rapport d'audit de sécurité :** quand une erreur survient, l'API renvoie
  au client une page HTML contenant la **pile d'appels complète** : chemins des fichiers sur
  le serveur, noms des modules, numéros de lignes. L'équipe affirme pourtant avoir écrit un
  gestionnaire d'erreurs.

  Comportement attendu :

  - une erreur qui porte un `status` (par exemple 404) renvoie ce code avec
    `{ "error": message }` ;
  - toute autre erreur renvoie `500` avec `{ "error": "Erreur interne" }`, sans aucun détail ;
  - **jamais** de pile d'appels dans la réponse.

  Pas d'indice. La [documentation d'Express sur la gestion des erreurs](https://expressjs.com/en/guide/error-handling.html)
  est ta seule alliée.
