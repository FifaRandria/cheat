brief: |
  **Exercice d'écriture : cette fois, tu écris les tests.** L'API est corrigée. Pour que les
  failles et les bugs ne reviennent jamais, écris dans `scenarios.js` la fonction
  `verifierApi(nouvelleApp)`. Elle doit **échouer** (un `assert` qui lève une erreur) dès que
  l'API viole une de ces quatre règles :

  1. `GET /outils` avec `query: { categorie: "electro" }` ne renvoie **que** des outils electro ;
  2. `POST /prets` **sans connexion** répond 401 ;
  3. emprunter un outil **déjà prêté** répond 409 ;
  4. un membre qui rend le prêt **d'un autre** reçoit 403 (le prêt n°1 appartient à Bob ;
     les jetons sont `jeton-ada` et `jeton-bob`).

  **Comment ton travail est vérifié** : ta fonction est lancée sur la vraie API, où elle doit
  réussir, puis sur quatre versions **sabotées** de l'API, chacune violant une règle. Elle doit
  détecter chaque sabotage. Un test qui ne détecte rien ne protège rien.

  `nouvelleApp()` donne une application neuve avec une base neuve : utilise-en une par règle.

  > **Côté chef de projet** : des tests de non-régression sont la condition d'une « définition
  > de terminé » honnête : sans eux, « fini » veut dire « fini jusqu'au prochain bug ».
hints:
  - "Inspire-toi de l'exemple déjà écrit : une requête avec app.handle, puis assert.equal sur le status."
  - "Pour la règle 1, vérifie que CHAQUE outil reçu a la catégorie electro : res.body.every(…)."
  - "Pour la règle 3, emprunte deux fois le même outil disponible (l'outil 1) : la première fois 201, la seconde 409."
tests: tests/
