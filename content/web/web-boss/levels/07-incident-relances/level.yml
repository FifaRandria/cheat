brief: |
  **Mode Blackout.** Trois semaines après la mise en ligne, le téléphone de l'association ne
  s'arrête plus. Chaque matin, `listerRelances(db, aujourdhui)` produit la liste des membres à
  relancer, et quelque chose ne va pas.

  La fonction doit renvoyer `[{ membre, outil, joursDeRetard }]` pour les outils **non rendus**
  dont la date de fin prévue est **dépassée**, du **plus gros retard au plus petit** (à retard
  égal, par ordre alphabétique des membres).

  Lis les logs, reproduis, isole. Seule la documentation est disponible.
