brief: |
  **Premier exercice d'écriture.** Il n'y a pas de bug à chercher : la fonction est vide, et
  c'est à toi de l'écrire. Les tests décrivent ce qu'elle doit faire.

  Le site affiche les prix en anglais (`12.5`). Le client veut un affichage français.

  Écris `formaterPrix(montant)` qui renvoie un texte :

  - avec **deux chiffres après la virgule** : `12.5` donne `"12,50 €"` ;
  - avec une **virgule** comme séparateur décimal ;
  - suivi d'une espace et du symbole `€` ;
  - arrondi au centime : `19.999` donne `"20,00 €"` ;
  - un montant négatif (remboursement) garde son signe : `-4.2` donne `"-4,20 €"`.

  Méthode : lance les tests tout de suite (ils échouent), puis fais-les passer **un par un**.
hints:
  - "Regarde le tableau « Les outils qui servent souvent » de la leçon : une méthode donne deux chiffres après la virgule."
  - "toFixed(2) renvoie un texte avec un point. Il reste à remplacer ce point."
  - "montant.toFixed(2).replace(\".\", \",\") + \" €\""
tests: tests/
