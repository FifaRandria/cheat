      return elements[debut:fin]
  TypeError: slice indices must be integers or None or have an __index__ method
hints:
  - "Lis la dernière ligne du traceback, puis affiche debut et fin avec print(repr(…)). Quel est leur type ?"
  - "En Python, / donne toujours un nombre à virgule. La division entière s'écrit //."
  - "Pour nombre_de_pages, il faut arrondir au-dessus : math.ceil, comme Math.ceil en JavaScript."
