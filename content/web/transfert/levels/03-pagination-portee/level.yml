brief: |
  La pagination du catalogue a été portée de JavaScript vers Python. L'original utilisait
  `Math.ceil` et `Math.floor`. Le portage plante dès la première page.

  - `nombre_de_pages(total, par_page)` : le nombre de pages nécessaires (25 articles, 10 par
    page : 3 pages ; aucun article : 0 page).
  - `page(elements, numero, par_page)` : les éléments de la page `numero` (la première page
    porte le numéro 1). Une page au-delà de la dernière est vide.
logs: |
