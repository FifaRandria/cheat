entry: dashboard.js
brief: |
  **Incident en cours.** Le service boursier ne répond plus, et depuis, le
  tableau de bord est **entièrement vide** pour tous les utilisateurs, alors
  que la météo et les actualités fonctionnent.

  `buildDashboard(sources)` reçoit un objet `{ nom: fonctionAsync }` et doit
  renvoyer un widget par source :

  - `{ status: "up", data }` si la source a répondu ;
  - `{ status: "down", error: message }` si elle a échoué.

  Le tableau de bord ne doit **jamais** rejeter à cause d'une seule source.

  Mode Blackout : pas d'indice, seulement les logs et la
  [documentation MDN](https://developer.mozilla.org/fr/docs/Web/JavaScript/Reference/Global_Objects/Promise).
