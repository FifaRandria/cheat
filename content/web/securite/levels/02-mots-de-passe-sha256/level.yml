brief: |
  Une sauvegarde de la base a fuité. En quelques heures, 70 % des mots de passe ont été
  retrouvés : ils étaient stockés en `sha256`, sans sel. L'équipe doit changer de méthode
  avant de demander à tous les membres de réinitialiser leur mot de passe.

  Réécris `comptes.js` :

  - `hacherMotDePasse(mdp)` renvoie `"sel:empreinte"`, où `sel` est fait de **16 octets
    aléatoires** en hexadécimal, et `empreinte` vaut `scryptSync(mdp, sel, 64)` en hexadécimal ;
  - `verifierMotDePasse(mdp, stocke)` renvoie `true` ou `false`, en comparant avec
    `timingSafeEqual` ; une valeur stockée mal formée donne `false`, sans planter.

  Tout est dans `node:crypto` : `randomBytes`, `scryptSync`, `timingSafeEqual`.
logs: |
