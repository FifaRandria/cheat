hints:
  - "Les logs montrent la même empreinte pour 37 comptes : sans sel, un même mot de passe donne une même empreinte."
  - "randomBytes(16).toString(\"hex\") pour le sel, scryptSync(mdp, sel, 64).toString(\"hex\") pour l'empreinte, et on stocke les deux séparés par « : »."
  - "Pour vérifier : découpe sur « : », recalcule scryptSync avec le même sel, compare les deux Buffer avec timingSafeEqual (même longueur obligatoire). Entoure le tout d'un contrôle de format."
