# Carte des parcours de Rustine.
#
# Chaque module correspond au dossier content/<parcours>/<module>/, qui contient :
#   lessons/NN-titre.md          les leçons, dans l'ordre des numéros
#   levels/NN-titre/level.yml    les niveaux (incidents)
# Un module sans leçon ni niveau apparaît « en chantier ».

- id: web
  title: Développeur web fullstack
  tagline: Du premier console.log à une application dockerisée avec un CI vert.
  description: >
    Tu commences par les bases de JavaScript, sans aucun prérequis, puis tu construis et répares un
    vrai backend, une base de données, un frontend, et tout ce qu'il faut pour les mettre en
    production.
  icon: code
  modules:
    - id: html-css
      code: W0
      title: HTML et CSS
      tagline: La structure d'une page, l'accessibilité, la cascade et la mise en page.
      notions:
        - Balises sémantiques
        - Formulaires
        - Accessibilité
        - Cascade et spécificité
        - Flexbox
        - Responsive
      phase: MVP
    - id: js-bases
      code: W1
      title: Bases de JavaScript
      tagline: Variables, conditions, boucles, fonctions. Le point de départ.
      notions:
        - Variables
        - Conditions
        - Boucles
        - Fonctions
        - Tableaux
        - Objets
      phase: MVP
    - id: js-async
      code: W2
      title: JavaScript asynchrone
      tagline: Promesses, async/await, et les bugs qui vont avec.
      notions:
        - Callbacks
        - Promesses
        - async/await
        - Promise.all
      phase: MVP
    - id: navigateur
      code: W3
      title: JavaScript dans le navigateur
      tagline: Le DOM, les événements, fetch, et une interface organisée autour d'un état.
      notions:
        - DOM
        - Événements
        - Formulaires
        - fetch
        - État et rendu
      phase: MVP
    - id: outils
      code: W4
      title: Terminal, Git et HTTP
      tagline: Les outils du diagnostic au quotidien.
      notions:
        - Terminal
        - Git
        - git bisect
        - HTTP
      phase: MVP
    - id: express
      code: W5
      title: Backend Express et API REST
      tagline: Routes, middlewares, validation, JWT.
      notions:
        - Routes
        - Middlewares
        - Validation
        - JWT
      phase: MVP
    - id: postgres
      code: W6
      title: SQL et bases de données
      tagline: Requêtes, jointures, index, N+1 et transactions.
      notions:
        - SELECT
        - WHERE
        - JOIN
        - Index
        - N+1
        - Transactions
      phase: MVP
    - id: frontend
      code: W7
      title: Frontend avec React
      tagline: Composants, état, effets, et les bugs de rendu.
      notions:
        - Composants
        - État immuable
        - useEffect
        - Hydratation
      phase: MVP
    - id: typescript
      code: W8
      title: TypeScript et tests
      tagline: Des types pour attraper les bugs avant l'exécution, et des tests que tu écris toi-même.
      notions:
        - Types
        - Unions et narrowing
        - null et strict
        - Écrire des tests
      phase: MVP
    - id: securite
      code: W9
      title: Sécurité web
      tagline: Contrôle d'accès, XSS, injections, mots de passe, secrets et cookies.
      notions:
        - Autorisation
        - XSS
        - Injections
        - Mots de passe
        - Secrets
        - Cookies et CORS
      phase: MVP
    - id: docker
      code: W10
      title: Docker
      tagline: Images, volumes, réseaux, compose.
      notions:
        - Images
        - Dockerfile
        - Volumes
        - Réseaux
      phase: MVP
    - id: cicd
      code: W11
      title: CI/CD
      tagline: Pipelines, GitHub Actions, déploiement.
      notions:
        - Pipelines
        - GitHub Actions
        - Déploiement
      phase: MVP
    - id: transfert
      code: W12
      title: Changer de langage
      tagline: Apprendre un nouveau langage vite, en partant de ce que tu sais déjà.
      notions:
        - Méthode
        - JavaScript vers Python
        - Pièges propres
        - Familles de bugs
        - Documentation
      phase: MVP
    - id: web-boss
      code: W13
      title: Projet final web
      tagline: La Boîte à outils, du cahier des charges à la mise en production.
      notions:
        - Cahier des charges
        - Dépôt SQL
        - API REST
        - Sécurité
        - Tests
        - Mise en production
      phase: MVP

- id: ia
  title: Intelligence artificielle
  tagline: Python, entraînement, fine-tuning, RAG et automatisation.
  description: >
    Tu apprends Python depuis zéro, puis tu comprends comment on entraîne et adapte un modèle (LoRA,
    QLoRA), comment on lui donne accès à tes documents (RAG) et comment l'intégrer dans des
    automatisations.
  icon: spark
  modules:
    - id: py-bases
      code: IA0
      title: Bases de Python
      tagline: print, variables, conditions, boucles, fonctions, listes.
      notions:
        - Variables
        - Conditions
        - Boucles
        - Fonctions
        - Listes
        - Dictionnaires
      phase: MVP
    - id: py-data
      code: IA1
      title: Python pour la data
      tagline: venv, numpy, pandas, notebooks.
      notions:
        - venv
        - numpy
        - pandas
        - Notebooks
      phase: MVP
    - id: finetuning
      code: IA2
      title: Entraînement et fine-tuning
      tagline: Loss, overfitting, LoRA, QLoRA, VRAM.
      notions:
        - Dataset
        - Epochs
        - Loss
        - Overfitting
        - LoRA
        - QLoRA
      phase: MVP
    - id: llm
      code: IA3
      title: LLM par API, prompts et agents
      tagline: Appeler un modèle, écrire un bon prompt, évaluer, et construire un agent avec des outils.
      notions:
        - API Messages
        - Prompts
        - Sorties JSON
        - Évaluation
        - Agents et outils
      phase: MVP
    - id: rag
      code: IA4
      title: RAG
      tagline: Embeddings, chunking, recherche, prompt.
      notions:
        - Embeddings
        - Chunking
        - Base vectorielle
      phase: MVP
    - id: n8n
      code: IA5
      title: Automatisation avec n8n
      tagline: Webhooks, workflows, réessais et idempotence.
      notions:
        - Webhooks
        - Nœuds
        - Credentials
      phase: MVP
    - id: ia-boss
      code: IA6
      title: Projet final IA
      tagline: L'assistant de la Boîte à outils, de l'idée à la mise en ligne.
      notions:
        - Cadrage
        - RAG
        - Prompt
        - Agent et garde-fous
        - Évaluation
        - Production
      phase: MVP

- id: projet
  title: Gestion de projet
  tagline: Mener un projet web du cadrage à la livraison, et diriger une équipe.
  description: >
    Coder ne suffit pas : il faut savoir quoi construire, dans quel ordre, avec qui, et comment
    garder une équipe motivée et efficace. Ce parcours couvre les étapes d'un projet web et le
    métier de lead.
  icon: flag
  modules:
    - id: etapes
      code: GP0
      title: Les étapes d'un projet web
      tagline: Cadrer, planifier, construire, livrer, maintenir.
      notions:
        - Cycle de vie
        - Cahier des charges
        - MVP
        - Backlog
        - Scrum
      phase: MVP
    - id: equipe
      code: GP1
      title: Diriger une équipe
      tagline: Le rôle du lead, la communication, le feedback.
      notions:
        - Rôle du lead
        - Rituels
        - Déléguer
        - Feedback
        - Conflits
      phase: MVP
    - id: crises
      code: GP2
      title: Risques et gestion de crise
      tagline: Anticiper, réagir à un incident, écrire un post-mortem.
      notions:
        - Risques
        - Incident
        - Communication de crise
        - Post-mortem
      phase: MVP
    - id: pilotage
      code: GP3
      title: Piloter un projet
      tagline: Indicateurs, budget, reporting honnête et relation client.
      notions:
        - Vélocité
        - Burndown
        - Budget
        - Reporting
        - Devis
      phase: MVP
