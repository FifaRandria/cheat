entry: recherche.py
lessons: [rag-04]
brief: |
  Depuis une « optimisation » de la recherche, le chatbot répond complètement à côté. En
  affichant les passages envoyés au modèle, l'équipe constate qu'ils n'ont **rien à voir**
  avec la question. Et quand aucun document n'est pertinent, le chatbot invente quand même.

  `top_k(scores, k, seuil)` reçoit une liste de `(passage, score)` et doit renvoyer les
  **passages** (sans les scores) :

  - les `k` plus similaires, **du plus au moins similaire** ;
  - en écartant ceux dont le score est **inférieur** au `seuil` ;
  - moins de `k` s'il n'y en a pas assez, et une liste vide si aucun ne passe le seuil.
