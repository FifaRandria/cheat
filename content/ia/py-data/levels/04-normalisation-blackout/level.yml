brief: |
  **Mode Blackout.** Le pipeline d'entraînement plante une nuit sur deux, et quand il
  aboutit, le modèle donne des résultats incohérents. Les valeurs normalisées sortent parfois
  de l'intervalle [0, 1].

  `normaliser(valeurs)` doit appliquer la normalisation **min-max** :

  - chaque valeur devient `(v - min) / (max - min)`, entre 0 et 1 ;
  - si toutes les valeurs sont égales, renvoyer une liste de `0.0` ;
  - une liste vide donne une liste vide.

  Pas d'indice. Seulement les logs et la formule.
