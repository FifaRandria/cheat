entry: vocabulaire.py
lessons: [py-bases-05]
brief: |
  Avant d'entraîner un modèle de langage, on construit son **vocabulaire** : on compte combien
  de fois chaque mot apparaît dans le corpus. Le script plante dès le premier mot.

  `compter_mots(texte)` doit renvoyer un dictionnaire `{mot: nombre d'occurrences}`.
  Les mots sont séparés par des espaces, et la casse est ignorée (`Le` et `le` comptent
  pour le même mot).

  Exemple : `compter_mots("le chat et le chien")` renvoie
  `{"le": 2, "chat": 1, "et": 1, "chien": 1}`.
