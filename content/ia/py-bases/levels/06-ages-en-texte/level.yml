lessons: [py-bases-06, py-bases-02]
brief: |
  Le rapport mensuel calcule l'âge moyen des inscrits. Depuis l'import d'un nouveau fichier
  CSV, il plante. Certains âges ont été saisis comme du texte, parfois avec des espaces, et
  quelques lignes n'ont pas d'âge du tout.

  `age_moyen(personnes)` reçoit une liste de dictionnaires et doit :

  - accepter un âge sous forme de nombre **ou** de texte (`36`, `"41"`, `" 28 "`) ;
  - **ignorer** les personnes dont l'âge est absent, vide ou non numérique ;
  - renvoyer la moyenne des âges valides, ou `0` s'il n'y en a aucun.
