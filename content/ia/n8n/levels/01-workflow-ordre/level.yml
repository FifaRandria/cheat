id: n8n-01
title: Le workflow de demandes clients
order: 1
type: ordering
difficulty: 2
xp: 60
blackout: false
hintCost: 10
bugType: pipeline
lessons: [n8n-01, n8n-03]
brief: |
  Les demandes du formulaire de contact doivent être résumées par un LLM, enregistrées en base,
  puis signalées à l'équipe. Le workflow actuel appelle le LLM **avant** de vérifier les données
  (et paie des appels inutiles pour des formulaires vides), et répond au formulaire seulement à
  la fin, ce qui provoque des doublons.

  Remets les nœuds du workflow dans le bon ordre.
hints:
  - "On répond vite au formulaire, avant le traitement long, pour éviter qu'il renvoie la demande."
  - "On ne paie pas un appel au LLM pour des données invalides."
steps:
  - label: Webhook (réception du formulaire)
  - label: Répondre immédiatement « demande reçue »
  - label: Vérifier les données (e-mail présent, message non vide)
  - label: Ignorer la demande si son identifiant a déjà été traité
  - label: LLM, résumer et classer la demande
  - label: Enregistrer en base de données
  - label: Prévenir l'équipe sur la messagerie
