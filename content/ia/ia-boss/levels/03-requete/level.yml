brief: |
  **Exercice d'écriture.** Écris `preparer_requete(question, passages, historique)` dans
  `requete.py`. Elle renvoie le dictionnaire passé à `client.messages.create(**params)` :

  - `model` (la constante `MODELE`) et un `max_tokens` positif ;
  - `system` : la consigne `CONSIGNE` (déjà écrite), suivie d'une ligne vide, puis des
    documents. Chaque passage est délimité ainsi :
    `<document id="R3">Emprunts : Un membre peut emprunter…</document>` (titre, « : », texte),
    le tout entre `<documents>` et `</documents>`. Sans passage, le bloc contient
    `Aucun document pertinent.` ;
  - `messages` : les **6 derniers** messages de l'historique au plus (chaque message renvoyé
    coûte), en commençant toujours par un message `user`, puis la question.

  > **Côté chef de projet** : chaque message renvoyé coûte des jetons : limiter l'historique est
  > une décision de budget (leçon « Suivre le budget »).
hints:
  - "Écris d'abord une petite fonction bloc_documents(passages) qui renvoie le texte entre <documents> et </documents>."
  - "Les 6 derniers messages : historique[-6:]. S'ils commencent par un message assistant, retire-le."
  - "N'oublie pas : la consigne va dans system, jamais dans messages."
tests: tests/
